        <button id="close-button">关闭</button>
    </div>
    <script>
        // 获取可点击的文字
        const clickableText = document.getElementById('clickable-text');
        // 获取弹出框
        const my = document.getElementById('popup');
        // 获取关闭按钮
        const closeButton = document.getElementById('close-button');

        // 定义显示弹出框的函数
        function showMy() {
            my.style.display = 'block';
        }
 // 定义隐藏弹出框的函数
        function hideMy() {
            my.style.display = 'none';
        }

        // 为可点击的文字添加点击事件监听器
        clickableText.addEventListener('click', showMy);

        // 为关闭按钮添加点击事件监听器
        closeButton.addEventListener('click', hideMy);
    </script>
